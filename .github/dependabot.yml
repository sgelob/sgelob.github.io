# Dependency and workflow-action updates, proposed as pull requests (the actions are pinned to commit SHAs,
# so Dependabot is what keeps them current). Minor and patch updates are grouped to keep the noise low.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # astro check (@astrojs/check) refuses TypeScript 7.0 and npm ci fails on its peer range, which broke the
      # deploy after #13. Lift this once Astro's type checking supports TypeScript 7 (7.1+ via ts-content-mapper).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
