# Dependency and workflow-action updates, proposed as pull requests (the actions are pinned to commit SHAs,
# so Dependabot is what keeps them current). Minor and patch updates are grouped to keep the noise low.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
