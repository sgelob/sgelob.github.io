name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # daily rebuild: the home shows 4 galleries picked at random for the day
  workflow_dispatch:

# Read-only by default: the build job runs npm ci, the tests and the build (third-party code), so it gets no
# write rights. Only the deploy job may publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
      PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Cloudflare keeps the pages of olegs.be at its edge (a cache rule on the zone), so each deploy purges them.
      # Only the site's host: the photos on img.olegs.be never change under the same name and stay cached.
      # The short wait lets GitHub's own CDN serve the new build before Cloudflare fetches it again.
      - name: Purge the Cloudflare cache
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: 409280aaf9e4fc9a4970cdbafb869852
        run: |
          if [ -z "$CF_PURGE_TOKEN" ]; then
            echo "::warning::CF_PURGE_TOKEN is not set: the Cloudflare cache was not purged."
            exit 0
          fi
          sleep 30
          curl --silent --show-error --fail --request POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            --header "Authorization: Bearer $CF_PURGE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"hosts":["olegs.be"]}'
